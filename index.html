<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groww with you: demo</title>
<meta name="description" content="A clickable demo of Groww for Gen Z investors: practice replays, true costs before you buy, plain-language numbers and money tracking. All companies and numbers are fictional.">
<meta name="theme-color" content="#0F2A24">
<meta property="og:title" content="Groww with you: demo">
<meta property="og:description" content="Simple when you're starting. Powerful when you're ready. A clickable demo with fictional data.">

<style>
:root{
  --page-bg:#EAE6DC; --canvas:#F6F4EE; --paper:#FFFFFF;
  --ink:#132420; --ink-soft:#57675F;
  --brand:#0B6B4E; --brand-strong:#08543D; --brand-ink:#0A5940; --brand-tint:#E3F1E9;
  --loss:#AE3E34; --loss-bg:#FBEBE8;
  --caution:#8A5A0E; --caution-bg:#FBF0D9;
  --line:#E2DFD3; --line-soft:#EAE7DC;
  --practice-canvas:#F5F5FA; --practice:#3D4A72; --practice-strong:#2E3A5C; --practice-2:#5B678E; --practice-tint:#E9EBF3; --practice-line:#DBDEEB;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --ui:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);font-size:15px;line-height:1.5;color:var(--ink);background:var(--page-bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--practice);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Stage and phone frame */
.stage{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;gap:36px;padding:32px 24px}
.phone{position:relative;width:400px;max-width:100%;height:min(860px, calc(100vh - 48px));background:var(--canvas);border:1px solid #D9D4C5;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px -32px rgba(19,36,32,.4)}
.app{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto}
.phone.practice .app{background:var(--practice-canvas)}

/* Bars */
.practice-bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;background:var(--practice);color:#fff;padding:10px 20px}
.practice-bar svg{flex:none}
.practice-bar strong{display:block;font-size:14px;line-height:1.2;font-weight:600}
.practice-bar span{display:block;font-size:13px;opacity:.88;line-height:1.3}
.topbar{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 12px;min-height:56px}
.topbar.home{justify-content:space-between;padding-left:20px}
.wordmark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.topbar-title{font-family:var(--display);font-weight:600;font-size:17px;margin:0;line-height:1.25}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:inherit}
.icon-btn:hover{background:rgba(19,36,32,.06)}
.content{padding:4px 20px 32px}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
.tabbar[hidden]{display:none}
.tab{flex:1;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.tab[aria-current="page"]{color:var(--brand-ink);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.2}
.phone.practice .tabbar{background:var(--paper);border-top-color:var(--practice-line)}
.phone.practice .tab[aria-current="page"]{color:var(--practice)}

/* Type */
h1.page{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.18;letter-spacing:-.01em;margin:8px 0 6px}
h2.section{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.3;margin:26px 0 10px}
h3.small{font-size:15px;font-weight:600;margin:20px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink-soft)}
.phone.practice .muted{color:var(--practice-2)}
.big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.08;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.mid{font-family:var(--display);font-weight:600;font-size:23px;font-variant-numeric:tabular-nums;margin:0}
.num{font-variant-numeric:tabular-nums}
.gain{color:var(--brand-ink)}
.loss{color:var(--loss)}
.note{font-size:13px;color:var(--ink-soft);margin-top:14px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--brand-tint);color:var(--brand-ink);font-weight:600;vertical-align:middle}
.phone.practice .chip{background:var(--practice-tint);color:var(--practice)}

/* Home: welcome line + spotlight (primary CTA) + quiet secondary actions */
.welcome{font-size:16px;color:var(--ink-soft);margin:10px 0 22px;line-height:1.45}
.spotlight{background:var(--brand-tint);border-radius:20px;padding:22px 20px;margin:4px 0 22px}
.spotlight h1.page{margin-top:0}
.spotlight .btn{margin-top:16px}
.phone.practice .spotlight{background:var(--practice-tint)}
.quiet-actions{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 0}
.quiet-actions .row{min-height:60px}

/* Money hero */
.hero{padding:10px 0 18px;border-bottom:1px solid var(--line)}
.hero .label{font-size:14px;color:var(--ink-soft);margin:0}

/* Rows (navigation list) */
.rows{background:var(--paper);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:14px 16px;border:0;background:transparent;cursor:pointer;min-height:64px}
.row + .row{border-top:1px solid var(--line)}
.row:hover{background:var(--line-soft)}
.row .t{display:block;font-weight:600}
.row .s{display:block;color:var(--ink-soft);font-size:14px}
.row .grow1{flex:1;min-width:0}
.row .end{text-align:right;font-variant-numeric:tabular-nums}
.phone.practice .rows{border-color:var(--practice-line)}
.phone.practice .row:hover{background:var(--practice-tint)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;border:1.5px solid transparent;font-weight:600;cursor:pointer;padding:10px 16px;text-align:center}
.btn-primary{background:var(--brand-strong);color:#fff}
.btn-primary:hover{background:#063F2E}
.btn-outline{background:var(--paper);border-color:var(--ink);color:var(--ink)}
.btn-even{background:var(--paper);border-color:currentColor}
.btn-ghost{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-radius:12px;border:0;background:transparent;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--line-soft);color:var(--ink)}
.phone.practice .btn-primary{background:var(--practice)}
.phone.practice .btn-primary:hover{background:var(--practice-strong)}
.phone.practice .btn-outline,.phone.practice .btn-even{color:var(--practice);border-color:var(--practice)}
.phone.practice .btn-ghost{color:var(--practice-2)}
.phone.practice .btn-ghost:hover{background:var(--practice-tint);color:var(--practice)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stack{display:grid;gap:10px;margin-top:18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.play-controls{margin-top:16px}
.play-controls-quiet{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.play-controls-quiet .link{margin:0}
.link{border:0;background:transparent;padding:10px 0;min-height:44px;color:var(--brand-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.phone.practice .link{color:var(--practice)}
.term{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1.5px dotted currentColor;line-height:1.3}
.term:hover{border-bottom-style:solid}

/* Panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.phone.practice .panel{border-color:var(--practice-line)}
.panel.confirm{border-color:var(--practice);box-shadow:inset 4px 0 0 var(--practice)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.phone.practice .kv dt{color:var(--practice-2)}
.kv .total{border-top:1px solid var(--line);padding-top:8px}
.caution{display:flex;gap:10px;align-items:flex-start;background:var(--caution-bg);color:var(--caution);border-radius:12px;padding:12px 14px;margin-top:10px;text-align:left;width:100%;border:0;cursor:pointer}
.caution svg{flex:none;margin-top:2px}
.caution.static{cursor:default}
.success{display:flex;gap:10px;align-items:flex-start;background:var(--brand-tint);color:var(--brand-ink);border-radius:12px;padding:12px 14px;margin-top:10px}
ul.learn{margin:6px 0 0;padding-left:20px}
ul.learn li{margin-bottom:6px}

/* Inputs */
.field{margin-top:14px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.money-input{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;min-height:54px}
.money-input:focus-within{border-color:var(--ink)}
.phone.practice .money-input:focus-within{border-color:var(--practice)}
.money-input span{font-family:var(--display);font-size:22px;font-weight:600;margin-right:4px}
.money-input input{border:0;outline:0;background:transparent;font-family:var(--display);font-size:22px;font-weight:600;width:100%;font-variant-numeric:tabular-nums}
.error{color:var(--loss);font-size:14px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.choice{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--practice);background:var(--paper);color:var(--practice);font-weight:600;cursor:pointer}
.choice[aria-pressed="true"]{background:var(--practice);color:#fff}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart .base{stroke:currentColor;stroke-dasharray:2 4;opacity:.45}
.chart-wrap{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:12px}
.phone.practice .chart-wrap{border-color:var(--practice-line);color:var(--practice)}
.caption{font-size:12px;color:var(--ink-soft);margin:6px 2px 0}
.legend{display:grid;gap:6px;margin-top:10px}
.legend div{display:flex;justify-content:space-between;gap:10px}
.event{margin-top:12px;padding:10px 12px;border-left:3px solid var(--practice);background:var(--practice-tint)}

/* Timeline */
.timeline{list-style:none;margin:14px 0 0;padding:0}
.timeline li{position:relative;padding:0 0 18px 34px}
.timeline li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper)}
.timeline .done .dot{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.timeline .now .dot{border-color:var(--ink)}
.timeline .now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.timeline .late .dot{border-color:var(--caution);background:var(--caution-bg)}
.timeline .late .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--caution)}
.timeline .who{display:block;font-size:13px;color:var(--ink-soft)}
.timeline .t{font-weight:600}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-weight:600;line-height:1;flex:none}
details[open] > summary::before{content:'−'}
.quiz-opt{display:block;width:100%;text-align:left;min-height:48px;margin-top:8px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer}
.phone.practice .quiz-opt{border-color:var(--practice-line)}
.quiz-opt[aria-pressed="true"].right{border-color:var(--brand-strong);background:var(--brand-tint)}
.quiz-opt[aria-pressed="true"].wrong{border-color:var(--loss);background:var(--loss-bg)}
.feedback{margin-top:10px;font-size:14px}
.steps{font-size:13px;color:var(--practice-2);margin:0}
.empty{text-align:left;padding:28px 0}

/* Sheet */
.scrim{position:absolute;inset:0;background:rgba(19,36,32,.42);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin:0 -8px 0 -12px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;margin:4px 0 8px}
.sheet h3{font-size:14px;font-weight:600;color:var(--ink-soft);margin:18px 0 6px}
.sheet .lens-num{background:var(--canvas);border-radius:12px;padding:12px 14px}
.cost-row{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;min-height:44px}
.cost-row .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost-row .lab{border-bottom:1.5px dotted currentColor}
.foot{font-size:12px;color:var(--ink-soft);margin-top:14px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* Toast */
.toast{position:absolute;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .2s, transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* Reviewer tools — deliberately plain utility chrome, never mistaken for app UI */
.reviewer-toggle{display:none}
.reviewer-toggle svg{flex:none}
.controls{width:280px;flex:none;font-size:13px;background:#F0EEE6;border:1px solid #C9C4B4;border-radius:14px;padding:16px;position:sticky;top:32px;max-height:calc(100vh - 64px);overflow:auto;color:#3A423E;opacity:.92}
.controls:hover,.controls:focus-within{opacity:1}
.controls h2{font-family:var(--ui);font-weight:700;font-size:13px;margin:0 0 4px;text-transform:none;color:#3A423E}
.controls > p.muted{color:#6B7169;font-size:12px}
.controls h3{font-size:12px;font-weight:600;margin:14px 0 6px;color:#6B7169}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:34px;padding:4px 10px;border-radius:8px;border:1px solid #B9B4A3;background:#fff;cursor:pointer;font-size:12px;color:#3A423E}
.seg button[aria-pressed="true"]{background:#3A423E;color:#fff;border-color:#3A423E}
.tour{margin:0;padding-left:18px}
.tour li{margin:2px 0}
.tour button{border:0;background:transparent;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left;min-height:32px;font-size:12px;color:#3A423E}
.controls .close-controls{display:none}

@media (max-width: 899px){
  .controls{display:none}
  .controls.open{display:block;position:fixed;left:8px;right:8px;bottom:8px;top:auto;width:auto;max-height:70vh;z-index:61;box-shadow:0 20px 40px rgba(0,0,0,.3);opacity:1}
  .controls .close-controls{display:inline-flex;float:right}
  .reviewer-toggle{position:fixed;right:14px;bottom:14px;z-index:15;display:flex;align-items:center;gap:6px;font-size:12px;font-family:var(--ui);padding:6px 12px;min-height:38px;border-radius:8px;border:1px solid #8B9A93;background:#F0EEE6;color:#3A423E;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:.55;transition:opacity .15s}
  .reviewer-toggle:hover,.reviewer-toggle:focus-visible{opacity:1}
}
@media (max-width: 600px){
  .stage{padding:0}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none}
  .reviewer-toggle{bottom:calc(66px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion: reduce){
  .sheet{animation:none}
  .toast{transition:none}
}
</style>
</head>

  <div class="phone" id="phone">
    <div class="app" id="app"></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

</div>

<script>
(function () {
'use strict';

/* ---------- Formatting ---------- */
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const f0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const f2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rs = n => (n < 0 ? '−' : '') + '₹' + f0.format(Math.abs(Math.round(n)));
const rs2 = n => (n < 0 ? '−' : '') + '₹' + f2.format(Math.abs(n));
const pctAbs = (n, d = 1) => Math.abs(n).toFixed(d) + '%';
const signedPct = (n, d = 1) => (n < 0 ? '−' : n > 0 ? '+' : '') + pctAbs(n, d);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, one, many) => n === 1 ? one : many;
function moveText(delta, base) {
  if (Math.abs(delta) < 0.5) return 'no change yet';
  const p = base ? (delta / base) * 100 : 0;
  const d = Math.abs(p) < 1 ? 1 : 0;
  return (delta < 0 ? 'down ' : 'up ') + rs(Math.abs(delta)) + ' (' + signedPct(p, d) + ')';
}

/* ---------- Cost calculator (sample rate card) ---------- */
function estimateCharges(V, side) {
  let brokerage = Math.min(20, 0.001 * V);
  if (brokerage < 5) brokerage = Math.min(5, 0.025 * V);
  const exchange = 0.0000297 * V, sebi = 0.000001 * V, ipft = 0.000001 * V, stt = 0.001 * V;
  const stamp = side === 'buy' ? 0.00015 * V : 0;
  const dp = side === 'sell' && V >= 100 ? 20 : 0;
  const gst = 0.18 * (brokerage + exchange + sebi + dp);
  const total = r2(brokerage + exchange + sebi + ipft + stt + stamp + dp + gst);
  return { brokerage, exchange, sebi, ipft, stt, stamp, dp, gst, fees: exchange + sebi + ipft, total };
}
function roundTrip(V) {
  const buy = estimateCharges(V, 'buy').total, sell = estimateCharges(V, 'sell').total;
  const rt = r2(buy + sell);
  return { buy, sell, rt, pct: r2(rt / V * 100) };
}

function xirr(flows, current, today) {
  const yrs = f => (today - new Date(f.date + 'T12:00:00')) / (365 * 864e5);
  const fv = r => flows.reduce((s, f) => s + f.amt * Math.pow(1 + r, yrs(f)), 0);
  let lo = -0.99, hi = 10;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (fv(mid) > current) hi = mid; else lo = mid; }
  return ((lo + hi) / 2) * 100;
}

function chart({ series, upto, height = 150, baseline = null, label }) {
  const W = 340, H = height, P = 12;
  const all = series.flatMap(s => s.values).concat(baseline != null ? [baseline] : []);
  let min = Math.min(...all), max = Math.max(...all);
  const pad = (max - min) * 0.12 || 1; min -= pad; max += pad;
  const n = series[0].values.length, u = Math.min(upto, n - 1);
  const x = i => P + i * (W - 2 * P) / (n - 1);
  const y = v => P + (max - v) * (H - 2 * P) / (max - min);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  if (baseline != null) out += `<line class="base" x1="${P}" x2="${W - P}" y1="${y(baseline).toFixed(1)}" y2="${y(baseline).toFixed(1)}" stroke-width="1.5"/>`;
  series.forEach(s => {
    const pts = s.values.slice(0, u + 1).map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"${s.dashed ? ' stroke-dasharray="7 6"' : ''}/>`;
    out += `<circle cx="${x(u).toFixed(1)}" cy="${y(s.values[u]).toFixed(1)}" r="4.5" fill="${s.color}"/>`;
  });
  return out + '</svg>';
}

function prSeries(pr) {
  const R = DATA.replays[pr.id];
  if (pr.id === 'A' || pr.id === 'D') return { main: R.base.map(v => v * pr.invested / 1000) };
  if (pr.id === 'B') return { main: R.prices.slice() };
  return { main: R.one.map(v => v * pr.invested / 1000), spread: R.spread.map(v => v * pr.invested / 1000) };
}
function prLast(pr) { return prSeries(pr).main.length - 1; }
function prExit(pr) { return pr.soldAt != null ? pr.soldAt : prLast(pr); }
function prCharges(pr, exitIdx) {
  const s = prSeries(pr);
  if (pr.id === 'D') return null;
  if (pr.id === 'C') {
    const one = r2(estimateCharges(pr.invested, 'buy').total + estimateCharges(s.main[exitIdx], 'sell').total);
    const five = r2(5 * estimateCharges(pr.invested / 5, 'buy').total + 5 * estimateCharges(s.spread[exitIdx] / 5, 'sell').total);
    return { one, five };
  }
  return r2(estimateCharges(pr.invested, 'buy').total + estimateCharges(s.main[exitIdx], 'sell').total);
}

function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const [a, b, c] = p;
  if (!a || a === 'home') return scrHome();
  if (a === 'explore') return scrExplore();
  if (a === 'stock') return scrStock(b);
  if (a === 'buy') return scrBuy(b);
  if (a === 'ordered') return scrOrdered(b);
  if (a === 'fund') return scrFund();
  if (a === 'practice') {
    if (!b) return scrPractice();
    if (b === 'amount') return scrAmount(c);
    if (b === 'order') return scrOrder(c);
    if (b === 'play') return scrPlay(c);
    if (b === 'debrief') return scrDebrief(c);
    if (b === 'risk') return scrRisk();
  }
  if (a === 'money') {
    if (!b) return scrMoney();
    if (b === 'redeem') return scrRedeem();
    if (b === 'track') return scrTrack();
  }
  return scrNotFound();
}

/* ---------- Render ---------- */
function captureFocus(root) {
  const el = document.activeElement;
  if (!el || !root.contains(el)) return null;
  return { act: el.getAttribute('data-act'), arg: el.getAttribute('data-arg'), id: el.id };
}
function restoreFocus(root, k) {
  if (!k) return;
  let el = k.id ? root.querySelector('#' + CSS.escape(k.id)) : null;
  if (!el && k.act) el = root.querySelector(`[data-act="${k.act}"]${k.arg != null ? `[data-arg="${CSS.escape(k.arg)}"]` : ''}`);
  if (el && !el.disabled) el.focus({ preventScroll: true });
}
function renderTabs(active) {
  if (!active) { tabbar.hidden = true; return; }
  tabbar.hidden = false;
  const tabs = [['home', '#/home', 'Home', I.home], ['practice', '#/practice', 'Practice', I.grid], ['money', '#/money', 'Money', I.wallet]];
  tabbar.innerHTML = tabs.map(([k, h, l, ic]) => `<button type="button" class="tab" data-act="${k === 'practice' ? 'startPractice' : 'go'}" data-arg="${h}" ${k === active ? 'aria-current="page"' : ''}>${ic}<span>${l}</span></button>`).join('');
}
function render() {
  clearTimeout(timer);
  const key = location.hash || '#/home';
  const same = key === lastRoute;
  const scroll = same ? appEl.scrollTop : 0;
  const focusKey = same ? captureFocus(appEl) : null;
  const s = route();
  phone.classList.toggle('practice', !!s.practice);
  let head = '';
  if (s.top === 'home') head = `<header class="topbar home"><span class="wordmark">Groww with you</span><button type="button" class="icon-btn" data-act="lens" data-arg="glossary" aria-label="Explain a term">${I.help}</button></header>`;
  else if (s.top === 'back') head = `<header class="topbar"><button type="button" class="icon-btn" data-act="go" data-arg="${s.back}" aria-label="Go back">${I.back}</button><p class="topbar-title">${esc(s.title)}</p></header>`;
  else head = `<header class="topbar home"><span class="wordmark">Groww with you</span><button type="button" class="icon-btn" data-act="lens" data-arg="glossary" aria-label="Explain a term">${I.help}</button></header>`;
  const bar = s.practice ? `<div class="practice-bar" role="note">${I.grid}<div><strong>Practice</strong><span>Simulated scenario. No real money.</span></div></div>` : '';
  appEl.innerHTML = bar + head + `<main class="content" id="main">${s.body}</main>`;
  renderTabs(s.tabs);
  appEl.scrollTop = scroll;
  if (same) restoreFocus(appEl, focusKey);
  else { const h = appEl.querySelector('h1'); if (h && lastRoute) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
  lastRoute = key;
  renderControls();
  const pr = state.pr;
  if (pr && pr.auto && key === '#/practice/play/' + pr.id && pr.placed && pr.step < prLast(pr) && !sheets.length) {
    timer = setTimeout(() => { pr.step++; if (pr.step >= prLast(pr)) pr.auto = false; render(); }, 700);
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
  if (act === 'scrim') { if (e.target === el) closeSheets(); return; }
  switch (act) {
    case 'go': closeSheets(); go(arg); break;
    case 'goClose': closeSheets(); go(arg); break;
    case 'toast': toast(arg); break;
    case 'lens': if (!sheets.length && state.pr && state.pr.auto) { state.pr.auto = false; render(); } openSheet('lens', arg, sheets.length > 0); break;
    case 'byb': openSheet('byb', arg, false); break;
    case 'hype': state.hypePick = null; openSheet('hype', arg, false); break;
    case 'hypePick': state.hypePick = arg; rerenderSheetKeepScroll(); break;
    case 'sheetBack': sheets.pop(); renderSheet(); { const h = sheetRoot.querySelector('h2'); if (h) h.focus(); } break;
    case 'closeSheet': case 'closeAll': closeSheets(); render(); break;
    case 'buyConfirm': {
      const st = DATA.stocks[arg], shares = Math.floor(Number(state.buyAmt[arg]) / st.price), V = shares * st.price;
      state.order = { id: arg, shares, value: V, charges: estimateCharges(V, 'buy').total };
      sheets = []; renderSheet(); go('#/ordered/' + arg); break;
    }
    case 'startPractice': closeSheets(); go('#/practice'); break;
    case 'startReplay':
      state.amt = { choice: 1000, custom: '' };
      if (arg === 'D' && !state.risk.done) go('#/practice/risk');
      else go('#/practice/amount/' + arg);
      break;
    case 'amtChoice': state.amt.choice = arg === 'custom' ? 'custom' : Number(arg); render();
      if (arg === 'custom') { const i = document.getElementById('custom-amt'); if (i) i.focus(); }
      break;
    case 'toOrder': { const pr = buildPr(arg); if (!pr) return; state.pr = pr; go('#/practice/order/' + arg); break; }
    case 'placePractice': if (state.pr) { state.pr.placed = true; render(); const b = appEl.querySelector('[data-act="go"][data-arg^="#/practice/play"]'); if (b) b.focus(); } break;
    case 'next': if (state.pr) { state.pr.auto = false; state.pr.step = Math.min(state.pr.step + 1, prLast(state.pr)); render(); } break;
    case 'pause': if (state.pr) { state.pr.auto = false; render(); } break;
    case 'skip': if (state.pr) { state.pr.auto = false; state.pr.step = prLast(state.pr); render(); } break;
    case 'sell': if (state.pr) { state.pr.auto = false; render(); openSheet('sell', '', false); } break;
    case 'confirmSell': if (state.pr) { state.pr.soldAt = state.pr.step; sheets = []; renderSheet(); go('#/practice/debrief/' + state.pr.id); } break;
    case 'quiz': if (state.pr) { state.pr.quizPick = Number(arg); render(); } break;
    case 'riskContinue': state.risk.done = true; state.amt = { choice: 1000, custom: '' }; go('#/practice/amount/D'); break;
    case 'redeem': { const c = redeemCheck(); if (!c.ok) return; state.redeemAmt = String(c.v); state.tracker = 'normal'; state.trackerFeedback = null; go('#/money/track/23842'); break; }
    case 'feedback': state.trackerFeedback = arg; render(); break;
    case 'fixBankDetails': state.tracker = 'resolved'; toast('Bank details updated. Your withdrawal has gone through.'); render(); break;
    case 'setAccount': state.account = arg; saveAccount(); closeSheets(); go(location.hash.startsWith('#/money') ? '#/money' : '#/home'); break;
    case 'setTracker':
      if (state.account === 'new') { state.account = 'investor'; saveAccount(); }
      state.tracker = arg; state.trackerFeedback = null; closeSheets(); closeControlsIfMobile(); go('#/money/track/23842'); break;
    case 'reset': clearTimeout(timer); state = initial(); try { localStorage.removeItem('gwy-account'); } catch (err) { /* ignore */ } sheets = []; renderSheet(); closeControlsIfMobile(); lastRoute = ''; go('#/home'); break;
    case 'toggleControls': {
      const open = !controls.classList.contains('open'); controls.classList.toggle('open', open);
      document.querySelector('.reviewer-toggle').setAttribute('aria-expanded', String(open));
      if (open) { const b = controls.querySelector('button:not(.close-controls)'); if (b) b.focus(); } else document.querySelector('.reviewer-toggle').focus();
      break;
    }
    case 'tourHome': state.account = 'new'; saveAccount(); closeSheets(); closeControlsIfMobile(); go('#/home'); break;
    case 'tourPractice': closeSheets(); closeControlsIfMobile(); go('#/practice'); break;
    case 'tourBuy': state.buyAmt.kiran = '500'; closeSheets(); closeControlsIfMobile(); go('#/buy/kiran'); break;
    case 'tourHype': closeSheets(); closeControlsIfMobile(); go('#/stock/zephyr'); break;
    case 'tourLens': state.account = 'investor'; saveAccount(); closeSheets(); closeControlsIfMobile(); go('#/money'); break;
    case 'tourTrack': state.account = 'investor'; saveAccount(); state.redeemAmt = '8000'; closeSheets(); closeControlsIfMobile(); go('#/money/redeem'); break;
    case 'tourRisk': state.risk = { done: false }; closeSheets(); closeControlsIfMobile(); go('#/practice/risk'); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target, kind = el.getAttribute('data-input');
  if (!kind) return;
  const val = el.value.replace(/[^\d]/g, '').slice(0, 7);
  if (val !== el.value) el.value = val;
  if (kind === 'buyAmt') {
    const id = el.getAttribute('data-arg'); state.buyAmt[id] = val;
    const s = buySummary(id); document.getElementById('buy-summary').innerHTML = s.html;
    document.getElementById('review-btn').disabled = !s.ok;
  } else if (kind === 'customAmt') {
    state.amt.custom = val; const a = amountFromChoice(), id = location.hash.split('/').pop();
    document.getElementById('amt-note').innerHTML = amtNote(id, a);
    document.getElementById('amt-continue').disabled = !a.ok;
  } else if (kind === 'redeemAmt') {
    state.redeemAmt = val; const c = redeemCheck();
    document.getElementById('redeem-note').innerHTML = c.ok ? '' : `<p class="error">${c.msg}</p>`;
    const b = document.getElementById('redeem-btn'); b.disabled = !c.ok; b.textContent = c.ok ? 'Redeem ' + rs(c.v) : 'Redeem';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (sheets.length) { closeSheets(); render(); }
    else if (controls.classList.contains('open')) { closeControlsIfMobile(); document.querySelector('.reviewer-toggle').focus(); }
    return;
  }
  if (e.key === 'Tab' && sheets.length) {
    const f = [...sheetRoot.querySelectorAll('button:not([disabled]), summary, input, [href], [tabindex="0"]')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !sheetRoot.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  if (e.key === 'Enter' && e.target.matches('input[data-input]')) {
    const btn = e.target.id === 'buy-amt' ? document.getElementById('review-btn') : e.target.id === 'custom-amt' ? document.getElementById('amt-continue') : e.target.id === 'redeem-amt' ? document.getElementById('redeem-btn') : null;
    if (btn && !btn.disabled) btn.click();
  }
});
window.addEventListener('hashchange', () => { if (sheets.length) { sheets = []; renderSheet(); } render(); });

render();
})();
</script>
</body>
